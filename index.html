<title>ODIN</title>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #ffffff;
    --dim: rgba(255,255,255,0.55);
    --faint: rgba(255,255,255,0.16);
    --brand: #D70064;
    --deep: #1b2262;
  }

  body {
    margin: 0;
    background: #04040a;
    color: var(--ink);
    font-family: "Rawline", "Raleway", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- aurora ---------- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .aurora .glow {
    position: absolute;
    inset: 0;
    opacity: 0.5;
    background-image:
      radial-gradient(circle at 30% 35%, rgba(215,0,100,0.20) 0%, transparent 70%),
      radial-gradient(circle at 70% 65%, rgba(27,34,98,0.28) 0%, transparent 70%);
    animation: aurora-pulse 10s ease-in-out infinite;
  }
  @keyframes aurora-pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 0.72; transform: scale(1.05); }
  }

  .aurora .blobs { position: absolute; inset: 0; mix-blend-mode: screen; }
  .aurora .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .blob-a {
    top: -25%; left: -25%; width: 50%; height: 50%;
    background: #7a0f45; opacity: 0.4;
    animation: drift-a 30s ease-in-out infinite alternate;
  }
  .blob-b {
    bottom: -25%; right: -25%; width: 50%; height: 50%;
    background: #1b2262; opacity: 0.45;
    animation: drift-b 40s ease-in-out infinite alternate;
  }
  .blob-c {
    top: 33%; left: 33%; width: 34%; height: 34%;
    background: #2b1a5e; opacity: 0.3;
    animation: drift-c 50s ease-in-out infinite alternate;
  }
  @keyframes drift-a {
    from { transform: translate(-50px, -20px) scale(1); }
    to   { transform: translate(50px, 20px) scale(1.2); }
  }
  @keyframes drift-b {
    from { transform: translate(50px, 20px) scale(1); }
    to   { transform: translate(-50px, -20px) scale(1.3); }
  }
  @keyframes drift-c {
    from { transform: translate(20px, -30px) rotate(0deg); }
    to   { transform: translate(-20px, 30px) rotate(180deg); }
  }

  .aurora .stars { position: absolute; inset: 0; }
  .aurora .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50%      { opacity: var(--peak, 0.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora .glow, .aurora .blob, .aurora .star { animation: none; }
    .aurora .star { opacity: 0.6; }
  }

  .stage {
    position: relative;
    z-index: 5;
    min-height: 100vh;
  }

  /* ---------- conteúdo ---------- */
  main {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14vh 32px;
  }

  .logo-wrap { position: relative; display: inline-block; line-height: 0; }
  .odin-logo {
    width: clamp(220px, 34vw, 380px);
    height: auto;
    display: block;
    filter: drop-shadow(0 24px 60px rgba(215,0,100,0.3));
  }

  }

  /* ---------- barra de busca com feixe na borda ---------- */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .beam {
    position: relative;
    width: min(560px, 100%);
    margin: 44px auto 0;
    padding: 1.5px;
    border-radius: 64px;
    overflow: hidden;
    isolation: isolate;
  }
  /* o feixe: um gradiente cônico girando por baixo, revelado só na
     faixa de 1.5px que sobra em volta do conteúdo */
  .beam::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 180%;
    aspect-ratio: 1;
    translate: -50% -50%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 250deg,
      #4a1d5c 285deg,
      #8a1560 310deg,
      #d70064 332deg,
      #ff3d8f 348deg,
      #6b2a8f 360deg);
    animation: beam-spin 3.1s linear infinite;
    z-index: -1;
  }
  @keyframes beam-spin { to { rotate: 360deg; } }

  .beam-inner {
    position: relative;
    border-radius: 64px;
    background: #131318;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 0 50px 0 rgba(255,255,255,0.02);
  }

  .searchbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 58px;
    padding: 0 22px;
  }
  .search-icon { color: var(--dim); flex-shrink: 0; }

  .clear-city {
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    color: var(--dim);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: scale(0.8);
    transition: opacity .2s ease, transform .2s ease, visibility .2s,
                background .2s ease, color .2s ease;
  }
  .clear-city.show { opacity: 1; visibility: visible; transform: none; }
  .clear-city:hover { background: rgba(215,0,100,0.22); color: #ff7ab0; }
  .searchbar input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.01em;
  }
  .searchbar input::placeholder { color: #6b6b76; }
  .searchbar input:focus { outline: none; }
  .searchbar input::-webkit-search-cancel-button { filter: invert(1); opacity: 0.4; }

  @media (prefers-reduced-motion: reduce) {
    .beam::before { animation: none; }
  }

  /* ---------- lista de sugestões ---------- */
  .search-wrap { position: relative; width: min(560px, 100%); margin: 44px auto 0; }
  .search-wrap .beam { margin: 0; width: 100%; }

  .suggestions {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 30;
    margin: 0;
    padding: 6px;
    list-style: none;
    max-height: 320px;
    overflow-y: auto;
    background: rgba(19,19,24,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity .2s ease, transform .2s ease, visibility .2s;
  }
  .suggestions.open { opacity: 1; visibility: visible; transform: none; }

  .suggestions li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.98rem;
    font-weight: 300;
    color: var(--ink);
  }
  .suggestions li:hover,
  .suggestions li[aria-selected="true"] { background: rgba(215,0,100,0.16); }
  .suggestions li mark {
    background: none;
    color: #ff5ba0;
    font-weight: 500;
  }
  .suggestions .uf {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--dim);
    border: 1px solid var(--faint);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .suggestions .msg {
    display: block;
    padding: 14px;
    font-size: 0.9rem;
    font-weight: 300;
    color: var(--dim);
    cursor: default;
  }
  .suggestions .msg:hover { background: none; }

  /* ---------- placeholder rotativo ---------- */
  .searchbar input::placeholder {
    color: #6b6b76;
    transition: opacity .35s ease;
    opacity: 1;
  }
  .searchbar input.ph-out::placeholder { opacity: 0; }

  /* ---------- operadoras ---------- */
  .operators {
    width: min(920px, 100%);
    margin: 52px auto 0;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity .45s ease, transform .45s ease, visibility .45s;
  }
  .operators.show { opacity: 1; visibility: visible; transform: none; }

  .operators-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .operators-head h2 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .operators-head .count { font-size: 0.8rem; font-weight: 300; color: var(--dim); }

  .toggle-all {
    background: none;
    border: 1px solid var(--faint);
    border-radius: 999px;
    padding: 7px 16px;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .25s ease, background .25s ease, color .25s ease;
  }
  .toggle-all:hover { border-color: rgba(215,0,100,0.6); }
  .toggle-all[aria-pressed="true"] {
    background: rgba(215,0,100,0.16);
    border-color: var(--brand);
    color: #ff7ab0;
  }

  .operator-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }

  .op-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(19,19,24,0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--ink);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform .25s cubic-bezier(0.34,1.56,0.64,1),
                border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .op-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(0,0,0,0.45);
    border-color: rgba(255,255,255,0.18);
  }
  .op-card[aria-pressed="true"] {
    border-color: var(--brand);
    background: rgba(215,0,100,0.12);
    box-shadow: 0 0 0 1px rgba(215,0,100,0.35), 0 12px 30px rgba(215,0,100,0.16);
  }

  .op-mark {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.06);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--dim);
    transition: background .25s ease, color .25s ease;
  }
  .op-card[aria-pressed="true"] .op-mark {
    background: var(--brand);
    color: #fff;
  }

  .op-name {
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.2;
  }
  .op-check {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 16px;
    height: 16px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity .25s ease, transform .25s ease;
    color: var(--brand);
  }
  .op-card[aria-pressed="true"] .op-check { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .op-card, .operators { transition: none; }
  }

  /* ---------- especialidades ---------- */
  .specialties {
    width: min(920px, 100%);
    margin: 44px auto 0;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    transition: opacity .45s ease, transform .45s ease, visibility .45s;
  }
  .specialties.show { opacity: 1; visibility: visible; transform: none; }

  .spec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .spec-head h2 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .spec-head .count { font-size: 0.8rem; font-weight: 300; color: var(--dim); }

  .spec-list {
    display: grid;
    gap: 4px 22px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--ink);
    transition: background .2s ease;
  }
  .check-item:hover { background: rgba(255,255,255,0.045); }

  .check-item input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .check-box {
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.28);
    background: transparent;
    transition: background .2s ease, border-color .2s ease;
  }
  .check-box svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6);
                   transition: opacity .2s ease, transform .2s ease; color: #fff; }
  .check-item input:checked + .check-box {
    background: var(--brand);
    border-color: var(--brand);
  }
  .check-item input:checked + .check-box svg { opacity: 1; transform: none; }
  .check-item input:focus-visible + .check-box {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  /* ---------- botão prospectar ---------- */
  .prospect-wrap {
    width: min(920px, 100%);
    margin: 34px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity .4s ease, transform .4s ease, visibility .4s;
  }
  .prospect-wrap.show { opacity: 1; visibility: visible; transform: none; }

  .clear-all {
    background: none;
    border: 0;
    padding: 8px 2px;
    color: var(--dim);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color .25s ease, border-color .25s ease;
  }
  .clear-all:hover { color: #ff7ab0; border-color: rgba(215,0,100,0.5); }

  .prospect {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    padding: 14px 30px;
    border-radius: 8px;
    border: 0;
    outline: 1px solid rgba(255,255,255,0.85);
    background: #ffffff;
    color: #0d0d12;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
  }
  /* o bloco gira e sobe da diagonal, cobrindo o botão no hover */
  .prospect .fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 12rem;
    height: 12rem;
    margin: 0 0 2.25rem 2.25rem;
    border-radius: 8px;
    background: var(--brand);
    transform: translate(-100%, 100%) rotate(-40deg);
    transition: all .5s ease-out;
  }
  .prospect:hover .fill,
  .prospect:focus-visible .fill {
    margin: 0 0 8rem 0;
    transform: translate(0, 100%) rotate(-40deg);
  }
  .prospect .txt {
    position: relative;
    width: 100%;
    text-align: left;
    transition: color .3s ease-in-out;
  }
  .prospect:hover .txt,
  .prospect:focus-visible .txt { color: #ffffff; }

  /* o botão só fica disponível depois que há especialidade escolhida */
  .prospect.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ---------- carregamento da prospecção ---------- */
  .prospect-overlay {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: rgba(6,6,12,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
  }
  .prospect-overlay.on { opacity: 1; visibility: visible; }

  .vprogress {
    position: relative;
    width: min(300px, 70vw);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 4px solid var(--brand);
    border-radius: 24px;
    background: #0a0a0e;
  }
  .vprogress .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .vprogress .bar {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 0%;
    z-index: 20;
    background: var(--brand);
    transition: height .3s ease;
  }
  /* faixas diagonais por cima do preenchimento */
  .vprogress .bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(45deg,
      rgba(255,255,255,.15) 25%, transparent 25%,
      transparent 50%, rgba(255,255,255,.15) 50%,
      rgba(255,255,255,.15) 75%, transparent 75%, transparent);
    background-size: 12px 12px;
    animation: stripes 1s linear infinite;
  }
  @keyframes stripes { to { background-position: 12px 0; } }

  .vprogress .pct {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .vprogress .pct small { font-size: 1rem; font-weight: 500; }

  .prospect-status {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .vprogress .bar::after { animation: none; }
    .prospect .fill { transition: none; }
  }

  /* ---------- menu (igual ao da home) ---------- */
  .menu-btn {
    position: fixed;
    top: 28px;
    right: 32px;
    z-index: 120;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 0;
    padding: 0;
    color: var(--ink);
    cursor: pointer;
  }
  .menu-btn svg { width: 30px; height: 30px; transition: transform .6s ease-out; }
  .menu-btn svg path { transition: all .6s ease-out; }
  .menu-btn .morph { stroke-dasharray: 12 63; }
  .menu-btn[aria-expanded="true"] svg { transform: rotate(-45deg); }
  .menu-btn[aria-expanded="true"] .morph {
    stroke-dasharray: 20 300;
    stroke-dashoffset: -32.42px;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 4, 10, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .45s ease, visibility .45s;
  }
  .menu-overlay.open { opacity: 1; visibility: visible; }
  .menu-overlay ul {
    list-style: none;
    margin: 0;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .menu-overlay li {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .menu-overlay.open li { opacity: 1; transform: none; }

  .roll {
    position: relative;
    display: block;
    overflow: hidden;
    line-height: 1.18;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transition: color .35s ease;
  }
  .roll:hover, .roll:focus-visible { color: var(--roll-hover, var(--ink)); }
  .roll-bottom { position: absolute; inset: 0; }
  .roll .l {
    display: inline-block;
    line-height: 1.18;
    transition: transform .4s ease-in-out;
  }
  .roll-bottom .l { transform: translateY(100%); }
  .roll:hover .roll-top .l,
  .roll:focus-visible .roll-top .l { transform: translateY(-100%); }
  .roll:hover .roll-bottom .l,
  .roll:focus-visible .roll-bottom .l { transform: translateY(0); }

  body.menu-open { overflow: hidden; }

  /* ---------- tela de carregamento ---------- */
  .loader-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
    transition: visibility .9s;
  }
  .loader-screen.on { visibility: visible; }
  .loader-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #ffffff;
    clip-path: circle(0% at 50% 50%);
    transition: clip-path .75s cubic-bezier(0.76, 0, 0.24, 1);
  }
  .loader-screen.on::before { clip-path: circle(75% at 50% 50%); }

  .quantum {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 176px;
    height: 96px;
    opacity: 0;
    transform: scale(0.86);
    transition: opacity .4s ease, transform .5s cubic-bezier(0.19,1,0.22,1);
  }
  .loader-screen.on .quantum { opacity: 1; transform: scale(1); transition-delay: .38s; }
  .quantum span { position: absolute; border-radius: 50%; will-change: transform, opacity; }
  .q1 { width: 16px; height: 16px; z-index: 30; background: #d70064;
        box-shadow: 0 0 12px rgba(215,0,100,.75), 0 0 24px rgba(215,0,100,.3);
        animation: quantum-a 3.8s cubic-bezier(0.37,0,0.63,1) infinite; }
  .q2 { width: 24px; height: 24px; z-index: 10; background: #1b2262;
        box-shadow: 0 0 16px rgba(27,34,98,.7), 0 0 30px rgba(27,34,98,.25);
        animation: quantum-b 5.6s cubic-bezier(0.37,0,0.63,1) infinite; }
  .q3 { width: 20px; height: 20px; z-index: 40; background: #f08200;
        box-shadow: 0 0 14px rgba(240,130,0,.75), 0 0 26px rgba(240,130,0,.3);
        animation: quantum-c 3.1s cubic-bezier(0.37,0,0.63,1) infinite; }
  .q4 { width: 14px; height: 14px; z-index: 0; background: #00b4aa;
        box-shadow: 0 0 12px rgba(0,180,170,.75), 0 0 24px rgba(0,180,170,.3);
        animation: quantum-d 6.4s cubic-bezier(0.37,0,0.63,1) infinite alternate; }
  .q5 { width: 18px; height: 18px; z-index: 20; background: #39a8e5;
        box-shadow: 0 0 14px rgba(57,168,229,.75), 0 0 26px rgba(57,168,229,.3);
        animation: quantum-c 4.7s cubic-bezier(0.37,0,0.63,1) infinite reverse; }

  @keyframes quantum-a {
    0%   { transform: translate3d(-46px, 7px, 0) scale(0.72); opacity: 0.45; }
    25%  { transform: translate3d(-23px, -7px, 0) scale(0.95); opacity: 0.78; }
    50%  { transform: translate3d(46px, 0, 0) scale(1.18); opacity: 1; }
    75%  { transform: translate3d(23px, 7px, 0) scale(0.95); opacity: 0.78; }
    100% { transform: translate3d(-46px, 7px, 0) scale(0.72); opacity: 0.45; }
  }
  @keyframes quantum-b {
    0%   { transform: translate3d(38px, -4px, 0) scale(1); opacity: 0.95; }
    25%  { transform: translate3d(19px, 7px, 0) scale(0.88); opacity: 0.72; }
    50%  { transform: translate3d(-38px, 3px, 0) scale(0.68); opacity: 0.42; }
    75%  { transform: translate3d(-19px, -7px, 0) scale(0.88); opacity: 0.72; }
    100% { transform: translate3d(38px, -4px, 0) scale(1); opacity: 0.95; }
  }
  @keyframes quantum-c {
    0%   { transform: translate3d(-27px, 2px, 0) scale(0.82); opacity: 0.65; }
    20%  { transform: translate3d(-17px, -5px, 0) scale(0.94); opacity: 0.82; }
    50%  { transform: translate3d(27px, 0, 0) scale(1.08); opacity: 1; }
    80%  { transform: translate3d(17px, 5px, 0) scale(0.94); opacity: 0.82; }
    100% { transform: translate3d(-27px, 2px, 0) scale(0.82); opacity: 0.65; }
  }
  @keyframes quantum-d {
    0%   { transform: translate3d(64px, 6px, 0) scale(0.52); opacity: 0.25; }
    20%  { transform: translate3d(43px, -5px, 0) scale(0.68); opacity: 0.45; }
    50%  { transform: translate3d(0, 3px, 0) scale(1); opacity: 0.9; }
    80%  { transform: translate3d(-43px, -5px, 0) scale(0.68); opacity: 0.45; }
    100% { transform: translate3d(-64px, 6px, 0) scale(0.52); opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) { .quantum span { animation: none; } }

  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  @media (max-width: 720px) {
    main { padding: 12vh 24px; }
    .menu-btn { top: 18px; right: 18px; }
  }
</style>
</head>
<body>

<div class="loader-screen" id="loader" role="status" aria-live="polite" aria-label="Carregando">
  <div class="quantum">
    <span class="q1"></span><span class="q2"></span><span class="q3"></span>
    <span class="q4"></span><span class="q5"></span>
  </div>
</div>

<div class="prospect-overlay" id="prospectOverlay" role="status" aria-live="polite">

</div>

    <div class="blob blob-b"></div>

</div>

<button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menuOverlay" aria-label="Abrir menu">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="morph" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"/>
    <path d="M7 16 27 16"/>

</button>

<script>
(function () {
  /* ---------- estrelas ---------- */
  const stars = document.getElementById("stars");
  const STAR_COUNT = 220;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = Math.random() < 0.85 ? 1 + Math.random() : 2 + Math.random() * 1.4;
    s.style.width = size.toFixed(2) + "px";
    s.style.height = size.toFixed(2) + "px";
    s.style.left = (Math.random() * 100).toFixed(3) + "%";
    s.style.top = (Math.random() * 100).toFixed(3) + "%";
    s.style.setProperty("--peak", (0.25 + Math.random() * 0.65).toFixed(2));
    s.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + "s";
    s.style.animationDelay = (Math.random() * 5).toFixed(2) + "s";
    if (size > 2) s.style.boxShadow = "0 0 6px rgba(255,255,255,0.8)";
    frag.appendChild(s);
  }
  stars.appendChild(frag);

  /* ---------- busca de cidades (API do IBGE) ---------- */
  (function citySearch() {
    const input = document.getElementById("q");
    const list = document.getElementById("suggestions");
    if (!input || !list) return;

    const ENDPOINT =
      "https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome";
    const MAX_RESULTS = 8;

    let cities = null;        // lista completa, baixada uma única vez
    let loading = null;       // promessa em andamento, evita pedidos repetidos
    let items = [];           // resultados exibidos no momento
    let active = -1;          // item destacado pelo teclado

    // "São Paulo" e "sao paulo" precisam casar: tira acentos e caixa
    const norm = str => str
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();

    // a UF aparece em dois caminhos diferentes na resposta do IBGE,
    // dependendo do município; tenta os dois antes de desistir
    function ufOf(city) {
      return (
        city?.microrregiao?.mesorregiao?.UF?.sigla ||
        city?.["regiao-imediata"]?.["regiao-intermediaria"]?.UF?.sigla ||
        ""
      );
    }

    function load() {
      if (cities) return Promise.resolve(cities);
      if (loading) return loading;
      loading = fetch(ENDPOINT)
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(data => {
          cities = data.map(c => ({
            name: c.nome,
            uf: ufOf(c),
            key: norm(c.nome)
          }));
          return cities;
        })
        .catch(err => {
          loading = null;
          throw err;
        });
      return loading;
    }

    function message(text) {
      list.innerHTML = "";
      const li = document.createElement("li");
      li.className = "msg";
      li.textContent = text;
      list.appendChild(li);
      open(true);
    }

    function open(state) {
      list.classList.toggle("open", state);
      input.setAttribute("aria-expanded", String(state));
      if (!state) {
        active = -1;
        input.removeAttribute("aria-activedescendant");
      }
    }

    // devolve o nome com o trecho digitado em destaque, sem usar innerHTML
    function label(name, queryLen, at) {
      const frag = document.createDocumentFragment();
      frag.appendChild(document.createTextNode(name.slice(0, at)));
      const mk = document.createElement("mark");
      mk.textContent = name.slice(at, at + queryLen);
      frag.appendChild(mk);
      frag.appendChild(document.createTextNode(name.slice(at + queryLen)));
      return frag;
    }

    function render(results, q) {
      list.innerHTML = "";
      items = results;
      if (!results.length) {
        message("Nenhuma cidade encontrada.");
        return;
      }
      results.forEach((c, i) => {
        const li = document.createElement("li");
        li.id = "city-" + i;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", "false");

        const name = document.createElement("span");
        name.appendChild(label(c.name, q.length, c.key.indexOf(q)));
        li.appendChild(name);

        if (c.uf) {
          const uf = document.createElement("span");
          uf.className = "uf";
          uf.textContent = c.uf;
          li.appendChild(uf);
        }

        li.addEventListener("mousedown", e => {
          e.preventDefault();       // evita perder o foco antes do clique
          choose(i);
        });
        list.appendChild(li);
      });
      open(true);
    }

    function search(raw) {
      const q = norm(raw);
      if (q.length < 2) { open(false); return; }

      load().then(all => {
        // quem começa com o termo vem primeiro; depois quem só o contém
        const starts = [], has = [];
        for (const c of all) {
          const at = c.key.indexOf(q);
          if (at === 0) starts.push(c);
          else if (at > 0) has.push(c);
          if (starts.length >= MAX_RESULTS) break;
        }
        const results = starts.concat(has).slice(0, MAX_RESULTS);
        // a busca pode ter mudado enquanto os dados chegavam
        if (norm(input.value) !== q) return;
        render(results, q);
      }).catch(() => {
        message("Não foi possível carregar as cidades. Tente de novo.");
      });
    }

    function highlight(i) {
      Array.from(list.querySelectorAll("[role='option']")).forEach((el, idx) => {
        el.setAttribute("aria-selected", String(idx === i));
      });
      if (i >= 0) {
        input.setAttribute("aria-activedescendant", "city-" + i);
        const el = list.children[i];
        if (el) el.scrollIntoView({ block: "nearest" });
      } else {
        input.removeAttribute("aria-activedescendant");
      }
    }

    function choose(i) {
      const c = items[i];
      if (!c) return;
      input.value = c.uf ? c.name + " - " + c.uf : c.name;
      open(false);
      syncClear();
      input.dispatchEvent(new CustomEvent("city:selected", {
        bubbles: true,
        detail: c
      }));
    }

    const clearBtn = document.getElementById("clearCity");

    function syncClear() {
      if (clearBtn) clearBtn.classList.toggle("show", input.value.length > 0);
    }

    if (clearBtn) {
      clearBtn.addEventListener("click", () => {
        input.value = "";
        items = [];
        open(false);
        syncClear();
        input.focus();
        // avisa que não há cidade escolhida; as seleções seguintes ficam de pé
        input.dispatchEvent(new CustomEvent("city:cleared", { bubbles: true }));
      });
    }

    let timer;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      syncClear();
      const value = input.value;
      // espera o usuário parar de digitar antes de filtrar
      timer = setTimeout(() => search(value), 140);
    });

    input.addEventListener("keydown", e => {
      const isOpen = list.classList.contains("open");
      if (e.key === "ArrowDown" && isOpen) {
        e.preventDefault();
        active = Math.min(active + 1, items.length - 1);
        highlight(active);
      } else if (e.key === "ArrowUp" && isOpen) {
        e.preventDefault();
        active = Math.max(active - 1, -1);
        highlight(active);
      } else if (e.key === "Enter" && isOpen && active >= 0) {
        e.preventDefault();
        choose(active);
      } else if (e.key === "Escape") {
        open(false);
      }
    });

    input.addEventListener("focus", () => {
      if (input.value.trim().length >= 2 && items.length) open(true);
    });
    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) open(false);
    });

    // baixa a lista assim que o campo recebe atenção, para a primeira
    // digitação já encontrar os dados prontos
    input.addEventListener("focus", () => { load().catch(() => {}); }, { once: true });

    // exemplo de uso: escute o evento para reagir à escolha
    // input.addEventListener("city:selected", e => console.log(e.detail));
  })();

  /* ---------- exemplos girando no campo de busca ---------- */
  (function rotatingPlaceholder() {
    const input = document.getElementById("q");
    if (!input) return;

    const EXAMPLES = [
      "São Paulo - SP", "Barueri - SP", "Belo Horizonte - MG", "Curitiba - PR",
      "Salvador - BA", "Recife - PE", "Porto Alegre - RS", "Fortaleza - CE",
      "Campinas - SP", "Goiânia - GO", "Manaus - AM", "Niterói - RJ",
      "Florianópolis - SC", "Osasco - SP", "Belém - PA", "Vitória - ES"
    ];

    let order = [];
    let paused = false;

    // embaralha para os exemplos não saírem sempre na mesma ordem
    function reshuffle() {
      order = EXAMPLES.slice();
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    }
    reshuffle();

    function next() {
      if (!order.length) reshuffle();
      return order.pop();
    }

    input.placeholder = next();

    setInterval(() => {
      if (paused || input.value) return;
      input.classList.add("ph-out");
      setTimeout(() => {
        input.placeholder = next();
        input.classList.remove("ph-out");
      }, 350);
    }, 2800);

    input.addEventListener("focus", () => {
      paused = true;
      input.classList.remove("ph-out");
      input.placeholder = "Buscar cidade...";
    });
    input.addEventListener("blur", () => {
      if (!input.value) { paused = false; input.placeholder = next(); }
    });
  })();

  /* ---------- operadoras ---------- */
  (function operators() {
    const OPERATORS = [
      { name: "OdontoPrev", mark: "OP" },
      { name: "SulAmérica", mark: "SA" },
      { name: "Unimed",     mark: "UN" },
      { name: "MetLife",    mark: "ML" },
      { name: "Hapvida",    mark: "HP" },
      { name: "Amil",       mark: "AM" }
    ];

    const section = document.getElementById("operators");
    const grid = document.getElementById("operatorGrid");
    const toggleAll = document.getElementById("toggleAll");
    const countEl = document.getElementById("opCount");
    const input = document.getElementById("q");
    if (!section || !grid || !toggleAll) return;

    const selected = new Set();
    const cards = new Map();

    function checkIcon() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "op-check");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "3");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M20 6 9 17l-5-5");
      svg.appendChild(path);
      return svg;
    }

    OPERATORS.forEach(op => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "op-card";
      card.setAttribute("aria-pressed", "false");
      card.setAttribute("aria-label", op.name);

      const mark = document.createElement("span");
      mark.className = "op-mark";
      mark.textContent = op.mark;
      mark.setAttribute("aria-hidden", "true");

      const text = document.createElement("span");
      const name = document.createElement("span");
      name.className = "op-name";
      name.textContent = op.name;
      text.appendChild(name);

      card.appendChild(mark);
      card.appendChild(text);
      card.appendChild(checkIcon());

      card.addEventListener("click", () => {
        if (selected.has(op.name)) selected.delete(op.name);
        else selected.add(op.name);
        sync();
      });

      cards.set(op.name, card);
      grid.appendChild(card);
    });

    function sync() {
      cards.forEach((card, name) => {
        card.setAttribute("aria-pressed", String(selected.has(name)));
      });
      const all = selected.size === OPERATORS.length;
      toggleAll.setAttribute("aria-pressed", String(all));
      toggleAll.textContent = all ? "Limpar seleção" : "Selecionar todas";
      countEl.textContent = selected.size
        ? "· " + selected.size + " de " + OPERATORS.length
        : "";

      section.dispatchEvent(new CustomEvent("operators:changed", {
        bubbles: true,
        detail: { selected: Array.from(selected) }
      }));
    }

    toggleAll.addEventListener("click", () => {
      if (selected.size === OPERATORS.length) selected.clear();
      else OPERATORS.forEach(op => selected.add(op.name));
      sync();
    });

    // esconde sem apagar: se o usuário trocar de cidade, as escolhas
    // continuam valendo e a seção volta como estava
    function reveal(state) {
      section.classList.toggle("show", state);
      section.setAttribute("aria-hidden", String(!state));
    }

    // só aparece depois que uma cidade foi escolhida na lista
    input.addEventListener("city:selected", e => {
      reveal(true);
      section.dataset.city = e.detail.name;
      section.dataset.uf = e.detail.uf || "";
    });

    // trocar ou apagar a cidade não recolhe as seções: o que já foi
    // marcado continua na tela, pronto para a próxima busca
    input.addEventListener("city:cleared", () => {
      delete section.dataset.city;
      delete section.dataset.uf;
    });

    // limpar tudo: volta ao estado inicial, inclusive as marcações
    document.addEventListener("filters:reset", () => {
      selected.clear();
      sync();
      delete section.dataset.city;
      delete section.dataset.uf;
      reveal(false);
    });

    sync();
  })();

  /* ---------- especialidades por operadora ---------- */
  (function specialties() {
    // cada operadora usa a própria nomenclatura
    const BY_OPERATOR = {
      "OdontoPrev": [
        "Clínico Geral", "Ortodontia", "Endodontia", "Periodontia",
        "Cirurgia", "Odontopediatria", "Prótese Dentária", "Radiologia"
      ],
      "Unimed": [
        "Cirurgia", "Clínico Geral", "Dentística", "Endodontia",
        "Odontopediatria", "Ortodontia", "Pacientes Especiais", "Periodontia",
        "Prótese", "Radiologia", "Urgência (Hora Comercial)", "Urgência (24 horas)"
      ],
      "MetLife": [
        "Cirurgia", "Clínico Geral", "Dentística", "Endodontia",
        "Odontopediatria", "Ortodontia", "Pacientes Especiais", "Periodontia",
        "Prótese", "Urgência", "Urgência 24 Horas", "Urgência Diurna"
      ],
      "Hapvida": [
        "Cirurgia", "Endodontia", "Clínico Geral", "Odontopediatria",
        "Ortodontia", "Periodontia", "Prótese Dentária", "Radiologia"
      ],
      "SulAmérica": [
        "Cirurgia", "Clínica Geral", "Dentística", "Endodontia",
        "Odontopediatria", "Ortodontia", "Pacientes Especiais", "Periodontia",
        "Prótese", "Radiologia", "Radiologia com Escaneamento",
        "Radiologia com Tomografia", "Urgência 24 Hs", "Urgência Diurna"
      ],
      "Amil": [
        "Cirurgia - Extrações", "Cirurgia Espec/Divulg", "Clínica Geral",
        "Endodontia - Canal", "Implantodontia",
        "Odontologia Estética - Clareamento", "Odontopediatria", "Ortodontia",
        "Periodontia - Tratamento de Gengiva", "Prótese Dentária"
      ]
    };

    // com duas ou mais operadoras, mostra a lista única e a tradução
    // para o nome de cada operadora acontece nos bastidores
    const CANONICAL = [
      "Cirurgia", "Clínica Geral", "Dentística", "Endodontia", "Implantodontia",
      "Odontologia Estética", "Odontopediatria", "Ortodontia",
      "Pacientes Especiais", "Periodontia", "Prótese", "Radiologia", "Urgência"
    ];

    const section = document.getElementById("specialties");
    const listEl = document.getElementById("specList");
    const countEl = document.getElementById("specCount");
    const toggleAll = document.getElementById("specToggleAll");
    const operators = document.getElementById("operators");
    if (!section || !listEl || !operators) return;

    let current = [];               // especialidades exibidas agora
    const selected = new Set();     // escolhas do usuário

    function checkIcon() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 10 10");
      svg.setAttribute("fill", "currentColor");
      svg.setAttribute("aria-hidden", "true");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M9.1603 1.12218C9.50684 1.34873 9.60427 1.81354 9.37792 2.16038L5.13603 8.66012C5.01614 8.8438 4.82192 8.96576 4.60451 8.99384C4.3871 9.02194 4.1683 8.95335 4.00574 8.80615L1.24664 6.30769C0.939709 6.02975 0.916013 5.55541 1.19372 5.24822C1.47142 4.94102 1.94536 4.91731 2.2523 5.19524L4.36085 7.10461L8.12299 1.33999C8.34934 0.993152 8.81376 0.895638 9.1603 1.12218Z");
      svg.appendChild(path);
      return svg;
    }

    function render() {
      listEl.innerHTML = "";
      current.forEach((spec, i) => {
        const label = document.createElement("label");
        label.className = "check-item";

        const box = document.createElement("input");
        box.type = "checkbox";
        box.name = "especialidade";
        box.value = spec;
        box.checked = selected.has(spec);
        box.addEventListener("change", () => {
          if (box.checked) selected.add(spec);
          else selected.delete(spec);
          sync();
        });

        const visual = document.createElement("span");
        visual.className = "check-box";
        visual.setAttribute("aria-hidden", "true");
        visual.appendChild(checkIcon());

        const text = document.createElement("span");
        text.textContent = spec;

        label.appendChild(box);
        label.appendChild(visual);
        label.appendChild(text);
        listEl.appendChild(label);
      });
      sync();
    }

    function sync() {
      const all = current.length > 0 && selected.size === current.length;
      toggleAll.setAttribute("aria-pressed", String(all));
      toggleAll.textContent = all ? "Limpar seleção" : "Selecionar todas";
      countEl.textContent = selected.size
        ? "· " + selected.size + " de " + current.length
        : "";

      section.dispatchEvent(new CustomEvent("specialties:changed", {
        bubbles: true,
        detail: { selected: Array.from(selected) }
      }));
    }

    toggleAll.addEventListener("click", () => {
      if (selected.size === current.length) selected.clear();
      else current.forEach(s => selected.add(s));
      listEl.querySelectorAll("input").forEach(i => {
        i.checked = selected.has(i.value);
      });
      sync();
    });

    operators.addEventListener("operators:changed", e => {
      const ops = e.detail.selected;

      if (!ops.length) {
        section.classList.remove("show");
        section.setAttribute("aria-hidden", "true");
        current = [];
        listEl.innerHTML = "";
        sync();
        return;
      }

      if (ops.length === 1) {
        current = (BY_OPERATOR[ops[0]] || []).slice();
      } else {
        // lista única; a conversão para o nome de cada operadora
        // acontece nos bastidores
        current = CANONICAL.slice();
      }

      // mantém o que já estava marcado, se ainda existir na nova lista
      Array.from(selected).forEach(s => {
        if (!current.includes(s)) selected.delete(s);
      });

      render();
      section.classList.add("show");
      section.setAttribute("aria-hidden", "false");
    });

    document.addEventListener("filters:reset", () => {
      selected.clear();
      current = [];
      listEl.innerHTML = "";
      section.classList.remove("show");
      section.setAttribute("aria-hidden", "true");
      sync();
    });
  })();

  /* ---------- botão prospectar e simulação de carregamento ---------- */
  (function prospect() {
    const wrap = document.getElementById("prospectWrap");
    const btn = document.getElementById("prospectBtn");
    const overlay = document.getElementById("prospectOverlay");
    const bar = document.getElementById("progressBar");
    const pct = document.getElementById("progressPct");
    const gauge = document.getElementById("vprogress");
    const specialties = document.getElementById("specialties");
    const operators = document.getElementById("operators");
    if (!wrap || !btn || !overlay) return;

    const clearAll = document.getElementById("clearAll");
    let running = false;

    // a barra aparece assim que há operadoras em cena, para o "limpar tudo"
    // ficar sempre ao alcance; o botão de prospectar só se libera depois
    // que existe especialidade marcada
    function showBar(state) { wrap.classList.toggle("show", state); }
    function readyToProspect(state) { btn.classList.toggle("hidden", !state); }

    specialties.addEventListener("specialties:changed", e => {
      readyToProspect(e.detail.selected.length > 0);
    });
    operators.addEventListener("operators:changed", e => {
      showBar(operators.classList.contains("show"));
      if (!e.detail.selected.length) readyToProspect(false);
    });

    if (clearAll) {
      clearAll.addEventListener("click", () => {
        const input = document.getElementById("q");
        if (input) {
          input.value = "";
          input.dispatchEvent(new CustomEvent("city:cleared", { bubbles: true }));
          const x = document.getElementById("clearCity");
          if (x) x.classList.remove("show");
        }
        document.dispatchEvent(new CustomEvent("filters:reset"));
        showBar(false);
        readyToProspect(false);
      });
    }

    function setProgress(v) {
      const clamped = Math.min(Math.max(v, 0), 100);
      bar.style.height = clamped + "%";
      pct.textContent = Math.round(clamped);
      gauge.setAttribute("aria-valuenow", String(Math.round(clamped)));
    }

    btn.addEventListener("click", () => {
      if (running) return;
      running = true;
      setProgress(0);
      overlay.classList.add("on");
      document.body.classList.add("menu-open");

      // avanço irregular, para parecer trabalho de verdade em vez de
      // uma contagem linear
      let value = 0;
      const timer = setInterval(() => {
        const step = value < 70 ? 1 + Math.random() * 3
                   : value < 92 ? 0.4 + Math.random() * 1.2
                   : 0.6 + Math.random();
        value = Math.min(value + step, 100);
        setProgress(value);

        if (value >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            overlay.classList.remove("on");
            document.body.classList.remove("menu-open");
            running = false;
          }, 700);
        }
      }, 90);
    });
  })();

  /* ---------- menu ---------- */
  const NAV = [
    { label: "INÍCIO", href: "index.html" },
    { label: "ORIGEM", href: "index.html" },
    { label: "ODIN", color: "#D70064", href: "odin.html" },
    { label: "ÍCARO", color: "#F08200", href: "#", project: true },
    { label: "CONTATO", href: "#" }
  ];
  const STAGGER = 0.035;
  const menuList = document.getElementById("menuList");
  const menuBtn = document.getElementById("menuBtn");
  const overlay = document.getElementById("menuOverlay");

  function rollLayer(text, cls) {
    const layer = document.createElement("span");
    layer.className = cls;
    text.split("").forEach((ch, i) => {
      const l = document.createElement("span");
      l.className = "l";
      l.textContent = ch === " " ? "\u00a0" : ch;
      l.style.transitionDelay = (STAGGER * Math.abs(i - (text.length - 1) / 2)) + "s";
      layer.appendChild(l);
    });
    return layer;
  }

  NAV.forEach((item, i) => {
    const name = item.label;
    const li = document.createElement("li");
    li.style.transitionDelay = (0.06 * i + 0.1) + "s";
    const a = document.createElement("a");
    a.className = "roll";
    a.href = item.href || "#";
    a.setAttribute("aria-label", name);
    if (item.color) a.style.setProperty("--roll-hover", item.color);
    if (item.project) a.setAttribute("data-project", name);
    a.appendChild(rollLayer(name, "roll-top"));
    a.appendChild(rollLayer(name, "roll-bottom"));
    li.appendChild(a);
    menuList.appendChild(li);
  });

  function setMenu(open) {
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
    overlay.classList.toggle("open", open);
    overlay.setAttribute("aria-hidden", String(!open));
    document.body.classList.toggle("menu-open", open);
  }
  menuBtn.addEventListener("click", () => {
    setMenu(menuBtn.getAttribute("aria-expanded") !== "true");
  });
  overlay.addEventListener("click", e => { if (e.target === overlay) setMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

  /* ---------- tela de carregamento ---------- */
  const loader = document.getElementById("loader");
  document.addEventListener("click", e => {
    const trigger = e.target.closest("[data-project]");
    if (!trigger) return;
    e.preventDefault();
    loader.classList.add("on");
    document.body.classList.add("menu-open");
    // provisório: volta sozinho depois de 5s
    setTimeout(() => {
      loader.classList.remove("on");
      document.body.classList.remove("menu-open");
    }, 5000);
  });
})();
